<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workhand Login / Registration</title>

    <link href="{% static 'assets2/img/star.png' %}" rel="icon">

    <!-- ===== Iconscout CSS ===== -->
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css">

    <!-- bootstrap -->
    <link rel="stylesheet" href="{% static 'bootstrapcss/bootstrap.min.css' %}">

    <!-- ===== CSS ===== -->
    <link rel="stylesheet" href="{% static 'logincss/style.css' %}">
</head>
<body class="text-dark bg-dark" style="background-image: url('{% static 'assets/img/hero-bg.jpg' %}')">

<div class="container">
    <div class="forms">
        <div class="form login">
            {% include 'partials/messages.html' %}
            <span class="title">Login as WorkHand</span>

            <form action="{% url 'workhandlogin' %}" method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="input-field">
                    <input type="text" placeholder="Enter your username" name="username" value="{{ login_form.username.value|default_if_none:'' }}" required autofocus>
                    <i class="uil uil-envelope icon"></i>
                </div>
                <div class="input-field">
                    <input type="password" class="password" placeholder="Enter your password" name="password" required>
                    <i class="uil uil-lock icon"></i>
                </div>

                <div class="checkbox-text">
                    <a href="{% url 'workhandforget' %}" class="text">Forgot password?</a>
                </div>

                <div class="input-field button">
                    <input type="submit" value="Login">
                </div>
            </form>

            <div class="login-signup">
                    <span class="text">Not a User?
                        <a href="#" class="text signup-link">Register Now</a>
                    </span>
            </div>
        </div>

        <!-- Registration Form -->
        <div class="form signup overflow-auto">
            <span class="title">Registration as WorkHand</span>

            <form action="{% url 'workhandregister' %}" method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="row">
                    <div class="col-12 col-md-6">
                        <div class="input-field">
                            <input type="text" placeholder="Enter your first name" name="fname" value="{{ register_form.fname.value|default_if_none:'' }}" required>
                            <i class="uil uil-user"></i>
                        </div>
                    </div>
                    <div class="col-12 col-md-6">
                        <div class="input-field">
                            <input type="text" placeholder="Enter your last name" name="lname" value="{{ register_form.lname.value|default_if_none:'' }}" required>
                            <i class="uil uil-user float-right"></i>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12 col-md-6">
                        <div class="input-field">
                            <input type="text" placeholder="Enter your username" name="username" value="{{ register_form.username.value|default_if_none:'' }}" required>
                            <i class="uil uil-user"></i>
                        </div>
                    </div>
                    <div class="col-12 col-md-6">
                        <div class="input-field">
                            <input type="email" placeholder="Enter your email" name="email" value="{{ register_form.email.value|default_if_none:'' }}" required>
                            <i class="uil uil-envelope icon"></i>
                        </div>
                    </div>
                </div>
                <div class="input-field">
                    <input type="password" class="password" placeholder="Create a password" name="password" required>
                    <i class="uil uil-lock icon"></i>
                </div>
                <div class="row mt-3">
                    <div class="col">
                        <label class="form-label mt-3" for="propic">Upload your profile picture:</label>
                    </div>
                    <div class="col">
                        <input type="file" name="propic" id="propic" class="form-control float-left">
                    </div>
                </div>
                <div class="row mt-3">
                    <label class="col-12 col-md-6 col-lg-5 col-form-label" for="category">Choose Workhand Category:</label>
                    <div class="col-12 col-md-6 col-lg-7">
                        <select class="form-select" aria-label="Workhand category" name="category" id="category" required>
                            <option value="" {% if not register_form.category.value %}selected{% endif %} disabled>Choose a category</option>
                            {% for c in cat %}
                            <option value="{{ c.id }}" {% if register_form.category.value|stringformat:"s" == c.id|stringformat:"s" %}selected{% endif %}>{{ c.category }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="row mt-3">
                    <label class="col-12 col-md-6 col-lg-5 col-form-label" for="state">State (optional):</label>
                    <div class="col-12 col-md-6 col-lg-7">
                        <select class="form-select" name="state" id="state" disabled>
                            <option value="" selected>Loading states...</option>
                        </select>
                    </div>
                </div>
                <div class="row mt-3">
                    <label class="col-12 col-md-6 col-lg-5 col-form-label" for="city">City (optional):</label>
                    <div class="col-12 col-md-6 col-lg-7">
                        <select class="form-select" name="city" id="city" disabled>
                            <option value="" selected>Select a state first</option>
                        </select>
                    </div>
                </div>

                <div class="input-field button">
                    <input type="submit" value="Register">
                </div>
            </form>

            <div class="login-signup">
                    <span class="text">Already a member?
                        <a href="#" class="text login-link">Login Now</a>
                    </span>
            </div>
        </div>
    </div>
</div>

<script src="{% static 'logincss/script.js' %}"></script>
<script src="{% static 'bootstrapjs/bootstrap.min.js' %}"></script>
<script src="{% static 'js/location-dropdowns.js' %}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        initLocationDropdowns({ countryId: 'country', stateId: 'state', cityId: 'city' });
    });
</script>
</body>
</html>
