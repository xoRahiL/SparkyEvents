<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css">
    <link rel="stylesheet" href="{% static 'bootstrapcss/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'logincss/style.css' %}">
</head>
<body style="background-image: url('{% static 'assets/img/hero-bg.jpg' %}')" class="text-dark bg-dark">

{% include 'partials/messages.html' %}

<div class="container w-50">
    <div class="forms">
        <div class="form login">
            <span class="title">Forgot Password</span>
            <p class="text" style="margin: 12px 0 18px; font-size: 14px;">
                Enter the email you registered with and we'll send you a link to choose a new password.
            </p>

            <form action="{% url 'workhandforget' %}" method="post">
                {% csrf_token %}
                <div class="input-field">
                    <input type="email" placeholder="Enter your email" name="email" required>
                    <i class="uil uil-envelope icon"></i>
                </div>
                <div class="input-field button">
                    <input type="submit" value="Send reset link">
                </div>
            </form>

            <div class="login-signup">
                    <span class="text">Already a User?
                        <a href="{% url 'workhandlogin' %}" class="text">Login</a>
                    </span>
            </div>
        </div>
    </div>
</div>

<script src="{% static 'js/loader.js' %}"></script>
</body>
</html>
