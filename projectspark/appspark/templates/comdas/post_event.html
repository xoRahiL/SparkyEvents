{% extends 'comdas/company_dashboard.html' %}
{% load static %}

{%  block content %}

<div class="pagetitle">
    <h1>Post Event</h1>
    <nav>
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{% url 'companydashboard' %}">Home</a></li>
            <li class="breadcrumb-item active">Post Event</li>
        </ol>
    </nav>
</div>

<div class="col-lg">

    <div class="card">
        <div class="card-body">
            <h5 class="card-title">Enter Event Details:</h5>
            {% include 'partials/messages.html' %}

            <!-- General Form Elements -->
            <form action="{% url 'postevent' %}" method="post">
                {% csrf_token %}
                <div class="row mb-3">
                    <label class="col-sm-3 col-form-label">Choose Event Category:</label>
                    <div class="col-sm-9">
                        <select class="form-select" aria-label="Default select example" name="event_category" required>
                            <option value="" selected disabled>Choose a category</option>
                            {% for e in ec %}
                            <option value="{{e.id}}">{{e.category}}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="name" class="col-sm-3 col-form-label">Event Name:</label>
                    <div class="col-sm-9">
                        <input type="text" id="name" class="form-control" name="event_name" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="desc" class="col-sm-3 col-form-label">Describe Your Event:</label>
                    <div class="col-sm-9">
                        <textarea class="form-control" id="desc" rows="4" name="description" required></textarea>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="sdate" class="col-sm-3 col-form-label">Start Date:</label>
                    <div class="col-sm-9">
                        <input type="text" id="sdate" class="form-control" name="start_date" placeholder="Pick a date below" readonly required>
                        <div id="sdate-calendar" class="mt-2"></div>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="edate" class="col-sm-3 col-form-label">End Date:</label>
                    <div class="col-sm-9">
                        <input type="text" id="edate" class="form-control" name="end_date" placeholder="Pick a date below" readonly required>
                        <div id="edate-calendar" class="mt-2"></div>
                    </div>
                </div>
                <div class="row mb-3">
                    <label class="col-sm-3 col-form-label">Choose Workhand Category:</label>
                    <div class="col-sm-9">
                        <select class="form-select" aria-label="Default select example" name="workhand_category" required>
                            <option value="" selected disabled>Choose a category</option>
                            {% for w in wc %}
                            <option value="{{w.id}}">{{w.category}}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="ttworkhand" class="col-sm-3 col-form-label">Total Workhand needed:</label>
                    <div class="col-sm-9">
                        <input type="number" id="ttworkhand" class="form-control" name="workhand_needed" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="payment" class="col-sm-3 col-form-label">Payment Range:</label>
                    <div class="col-sm-9">
                        <input type="number" id="payment" class="form-control" name="payment_range" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="address" class="col-sm-3 col-form-label">Street Address:</label>
                    <div class="col-sm-9">
                        <textarea class="form-control" id="address" rows="4" name="address" required></textarea>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="state" class="col-sm-3 col-form-label">State:</label>
                    <div class="col-sm-9">
                        <select id="state" class="form-select" name="state" required disabled>
                            <option value="" selected>Loading states...</option>
                        </select>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="city" class="col-sm-3 col-form-label">City:</label>
                    <div class="col-sm-9">
                        <select id="city" class="form-select" name="city" required disabled>
                            <option value="" selected>Select a state first</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <label class="col-sm-3 col-form-label">Submit Button</label>
                    <div class="col-sm-9">
                        <button type="submit" class="btn btn-primary">Submit Form</button>
                    </div>
                </div>

            </form><!-- End General Form Elements -->

        </div>
    </div>

</div>

<script src="{% static 'js/location-dropdowns.js' %}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        initLocationDropdowns({ countryId: 'country', stateId: 'state', cityId: 'city' });
    });
</script>

<!-- Inline calendars for date selection - visible immediately, no click needed -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        var startInput = document.getElementById('sdate');
        var endInput = document.getElementById('edate');

        var endPicker = flatpickr('#edate-calendar', {
            inline: true,
            dateFormat: 'Y-m-d',
            minDate: 'today',
            onChange: function (selectedDates, dateStr) {
                endInput.value = dateStr;
            },
        });

        flatpickr('#sdate-calendar', {
            inline: true,
            dateFormat: 'Y-m-d',
            minDate: 'today',
            onChange: function (selectedDates, dateStr) {
                startInput.value = dateStr;
                endPicker.set('minDate', dateStr); // end date can never be before start date
            },
        });
    });
</script>

{% endblock %}
