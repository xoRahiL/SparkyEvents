{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f6f8; font-family: 'Segoe UI', Arial, sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f6f8; padding: 30px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="480" cellpadding="0" cellspacing="0"
                   style="background-color:#ffffff; border-radius: 8px; overflow:hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08);">

                <!-- Header -->
                <tr>
                    <td style="background-color:#f82249; padding: 24px 32px;">
                        <span style="color:#ffffff; font-size: 20px; font-weight: 700; letter-spacing: 0.5px;">
                            ⚡ SparkyEvents
                        </span>
                    </td>
                </tr>

                <!-- Body -->
                <tr>
                    <td style="padding: 32px;">
                        <h2 style="margin: 0 0 16px; font-size: 18px; color: #1a1a2e;">{{ subject }}</h2>
                        <div style="font-size: 15px; line-height: 1.6; color: #444444;">
                            {{ message|linebreaks }}
                        </div>
                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td style="background-color:#f8f9fc; padding: 20px 32px; border-top: 1px solid #eeeeee;">
                        <p style="margin:0; font-size: 12px; color:#999999;">
                            This is an automated message from SparkyEvents. Please don't reply directly to this email.
                        </p>
                        <p style="margin: 6px 0 0; font-size: 12px; color:#999999;">
                            &copy; {% now "Y" %} SparkyEvents. All rights reserved.
                        </p>
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>
</body>
</html>
