<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose a New Password</title>
    <meta name="referrer" content="same-origin">

    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css">
    <link rel="stylesheet" href="{% static 'bootstrapcss/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'logincss/style.css' %}">
</head>
<body style="background-image: url('{% static 'assets/img/hero-bg.jpg' %}')" class="text-dark bg-dark">

{% include 'partials/messages.html' %}

<div class="container w-50">
    <div class="forms">
        <div class="form login">
            <span class="title">Choose a New Password</span>
            <p class="text" style="margin: 12px 0 18px; font-size: 14px;">
                Pick a new password for your account. This link works once and expires soon.
            </p>

            <form action="" method="post" data-loading-text="Updating your password&hellip;">
                {% csrf_token %}
                <div class="input-field">
                    <input type="password" class="password" placeholder="Enter new password" name="new_password1" required autocomplete="new-password" autofocus>
                    <i class="uil uil-lock icon"></i>
                </div>
                <div class="input-field">
                    <input type="password" class="password" placeholder="Confirm new password" name="new_password2" required autocomplete="new-password">
                    <i class="uil uil-lock icon"></i>
                </div>
                <div class="input-field button">
                    <input type="submit" value="Update password">
                </div>
            </form>

            <div class="login-signup">
                    <span class="text">Remembered it?
                        <a href="{% url login_url_name %}" class="text">Back to login</a>
                    </span>
            </div>
        </div>
    </div>
</div>

<script src="{% static 'js/loader.js' %}"></script>
</body>
</html>
